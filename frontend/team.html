<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <title>Team · PRISM</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="team">
  <div id="app"></div>
  <script src="/app-config.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
<!--
CODE WALKTHROUGH
1. The head sets the title, responsive viewport, theme colour, and shared CSS file.
2. The body has a page name so the shared JavaScript can choose the right content.
3. The app element is where JavaScript builds the navigation and page.
4. The deferred script loads the shared plain JavaScript application after the page markup is read.
-->
